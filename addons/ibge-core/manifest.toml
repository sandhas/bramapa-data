spec_version = 0

[addon]
id = "ibge-core"
name = "IBGE — dados básicos"
version = "0.2.0"
license = "CC-BY-4.0"
authors = ["Bramapa contributors"]
description = "População (estimativas anuais + Censo 2022), PIB a preços correntes e área territorial por UF e para o Brasil, via API SIDRA."
depends = []

[[properties]]
id = "populacao"
entity_type = "estado"
name = "População residente"
unit = "habitantes"
dtype = "i64"
periodicity = "anual"
source = "IBGE — Estimativas da população (SIDRA 6579) e Censo Demográfico 2022 (SIDRA 4714)"
source_url = "https://sidra.ibge.gov.br/tabela/6579"
file = "data/estado_populacao.csv"

[[properties]]
id = "pib"
entity_type = "estado"
name = "PIB a preços correntes"
unit = "R$ mil"
dtype = "i64"
periodicity = "anual"
source = "IBGE — Contas Regionais, PIB a preços correntes (SIDRA 5938)"
source_url = "https://sidra.ibge.gov.br/tabela/5938"
file = "data/estado_pib.csv"

[[properties]]
id = "area_km2"
entity_type = "estado"
name = "Área territorial"
unit = "km²"
dtype = "f64"
periodicity = "pontual"
source = "IBGE — Área territorial 2022 (SIDRA 4714)"
source_url = "https://sidra.ibge.gov.br/tabela/4714"
file = "data/estado_area_km2.csv"

[[properties]]
id = "populacao"
entity_type = "pais"
name = "População residente"
unit = "habitantes"
dtype = "i64"
periodicity = "anual"
source = "IBGE — Estimativas da população (SIDRA 6579) e Censo Demográfico 2022 (SIDRA 4714)"
source_url = "https://sidra.ibge.gov.br/tabela/6579"
file = "data/pais_populacao.csv"

[[properties]]
id = "pib"
entity_type = "pais"
name = "PIB a preços correntes"
unit = "R$ mil"
dtype = "i64"
periodicity = "anual"
source = "IBGE — Contas Nacionais, PIB a preços correntes (SIDRA 5938)"
source_url = "https://sidra.ibge.gov.br/tabela/5938"
file = "data/pais_pib.csv"

[[render]]
property = "estado/populacao"
kind = "choropleth"
ramp = "viridis"
scale = "log"

[[render]]
property = "estado/pib"
kind = "choropleth"
ramp = "viridis"
scale = "log"
