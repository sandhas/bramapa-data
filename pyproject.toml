[project]
name = "bramapa-data"
version = "0.1.0"
description = "Community data addons for Bramapa (declarative time series per entity) and their validator."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
authors = [{ name = "Bramapa contributors" }]
dependencies = []

[project.scripts]
bramapa-data = "bramapa_data.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bramapa_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
